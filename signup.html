<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | Wealthness</title><link rel="stylesheet" href="style.css"><style>body.auth-page{min-height:100vh;background:var(--canvas);display:grid;place-items:center;padding:20px}.auth-card{width:min(100%,430px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.auth-card h1{margin-bottom:8px}.auth-card p{color:var(--muted);font-size:13px;line-height:1.65}.auth-card .form-field{margin:14px 0}.auth-card .btn{width:100%;margin-top:10px}.auth-note{font-size:11px;background:var(--green-50);border-radius:10px;padding:12px;margin-top:16px;color:var(--green-900)}.auth-links{text-align:center;margin-top:18px;font-size:12px}.auth-links a{color:var(--green-700);font-weight:700}</style></head><body class="auth-page"><main class="auth-card"><div class="auth-brand"><div class="brand-mark">W</div><div><div class="brand-name">Wealthness</div><div class="brand-tag">Your Money, in Focus.</div></div></div><h1>Create a demo profile</h1><p>Set up a profile for this browser prototype.</p><form id="signup-form"><div class="form-field"><label for="signup-name">Display name</label><input id="signup-name" required maxlength="60"></div><div class="form-field"><label for="signup-username">Username</label><input id="signup-username" autocomplete="username" required minlength="3"></div><div class="form-field"><label for="signup-password">Password (demo only)</label><input id="signup-password" type="password" required minlength="6" autocomplete="new-password"></div><div class="form-field"><label for="signup-confirm">Confirm password</label><input id="signup-confirm" type="password" required autocomplete="new-password"></div><button class="btn btn-primary" type="submit">Create demo profile</button></form><div class="auth-note">This is only a visual prototype. It does not store your password or provide secure authentication. Your display name is saved locally.</div><div class="auth-links">Already have a demo profile? <a href="login.html">Log in</a> · <a href="index.html">Skip to dashboard</a></div><div id="auth-message" role="status" style="margin-top:12px;font-size:12px"></div><script>document.getElementById("signup-form").addEventListener("submit",e=>{e.preventDefault();const name=document.getElementById("signup-name").value.trim(),user=document.getElementById("signup-username").value.trim(),pass=document.getElementById("signup-password").value,confirmPass=document.getElementById("signup-confirm").value;if(pass!==confirmPass){document.getElementById("auth-message").textContent="Passwords do not match.";return}localStorage.setItem("wealthnessDemoUser",user);const existing=JSON.parse(localStorage.getItem("wealthnessData_v2")||"{}");existing.settings={...(existing.settings||{}),name};localStorage.setItem("wealthnessData_v2",JSON.stringify(existing));localStorage.setItem("wealthnessDemoSession",user);location.href="index.html"});</script></main></body></html>
