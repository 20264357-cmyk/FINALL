<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log In | Wealthness</title><link rel="stylesheet" href="style.css"><style>body.auth-page{min-height:100vh;background:var(--canvas);display:grid;place-items:center;padding:20px}.auth-card{width:min(100%,430px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.auth-card h1{margin-bottom:8px}.auth-card p{color:var(--muted);font-size:13px;line-height:1.65}.auth-card .form-field{margin:14px 0}.auth-card .btn{width:100%;margin-top:10px}.auth-note{font-size:11px;background:var(--green-50);border-radius:10px;padding:12px;margin-top:16px;color:var(--green-900)}.auth-links{text-align:center;margin-top:18px;font-size:12px}.auth-links a{color:var(--green-700);font-weight:700}</style></head><body class="auth-page"><main class="auth-card"><div class="auth-brand"><div class="brand-mark">W</div><div><div class="brand-name">Wealthness</div><div class="brand-tag">Your Money, in Focus.</div></div></div><h1>Welcome back</h1><p>Log in to continue to your finance workspace.</p><form id="login-form"><div class="form-field"><label for="login-username">Username</label><input id="login-username" autocomplete="username" required></div><div class="form-field"><label for="login-password">Password</label><input id="login-password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" type="submit">Log in</button></form><div class="auth-note">Demo only: this prototype does not provide secure accounts or verify passwords online. Do not use a real password.</div><div class="auth-links">No demo profile yet? <a href="signup.html">Create one</a> · <a href="index.html">Skip to dashboard</a></div><div id="auth-message" role="status" style="margin-top:12px;font-size:12px"></div><script>document.getElementById("login-form").addEventListener("submit",e=>{e.preventDefault();const user=document.getElementById("login-username").value.trim();const saved=localStorage.getItem("wealthnessDemoUser");if(!saved||user.toLowerCase()!==saved.toLowerCase()){document.getElementById("auth-message").textContent="Demo profile not found. Please sign up first.";return}localStorage.setItem("wealthnessDemoSession",user);location.href="index.html"});</script></main></body></html>
